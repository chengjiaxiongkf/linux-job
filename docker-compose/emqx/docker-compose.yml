version: '3.8'

services:
  emqx:
    image: emqx/emqx:5.8.4
    container_name: emqx
    hostname: emqx.local
    user: root                          # 关键：以 root 运行，避免权限问题
    restart: unless-stopped
    ports:
      - "21883:1883"      # MQTT TCP
      - "28083:8083"      # MQTT over WebSocket
      - "28084:8084"      # MQTT over WebSocket SSL
      - "28883:8883"      # MQTT SSL
      - "18083:18083"    # Dashboard
    environment:
      - EMQX_NODE_NAME=emqx@emqx.local
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=your_strong_password
    volumes:
      - ./emqx/data:/opt/emqx/data
      - ./emqx/log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - emqx-net

networks:
  emqx-net:
    driver: bridge