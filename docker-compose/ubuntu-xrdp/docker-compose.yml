services:
  vpn1:
    image: linuxserver/webtop:ubuntu-xfce
    container_name: vpn-env-1
    restart: always
    ports:
      - "13389:3000"        # WebTop 默认使用 Web 界面 (端口3000)
    environment:
      - PUID=1000           # 宿主用户ID（一般为1000）
      - PGID=1000           # 宿主组ID
      - TZ=Asia/Shanghai
    volumes:
      - ./data/vpn1/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun   # TUN 模式必须：容器默认没有这个设备节点
    cap_add:
      - NET_ADMIN                   # 创建 tun 网卡、改路由表/ip rule
      - NET_RAW                     # iptables/nft 规则
      - SYS_PTRACE                  # sing-box 读 /proc/<pid>/fd 反查进程，process_path 规则靠它防回环
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.disable_ipv6=1   # 容器网络无 IPv6，关掉避免 tun 下泄漏/失败
    # 必须用默认 bridge：compose 自建网络会强制保留内嵌 DNS 127.0.0.11，
    # 它的上游转发不在容器网络栈里做，TUN 下必然超时，dns: 也只会变成它的上游而已
    network_mode: bridge
    dns:
      - 223.5.5.5
      - 119.29.29.29
    extra_hosts:                    # 写死机场 IP，xray 连服务器时彻底不依赖 DNS，打破死锁
      - "ss.sampras.vip:23.184.200.89"
    shm_size: 2gb
